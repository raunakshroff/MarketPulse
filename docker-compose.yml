services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  markets-ref-data:
    build: ./markets-ref-data
    image: markets-ref-data:latest
    container_name: markets-ref-data
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/marketpulse
      SPRING_DATASOURCE_USERNAME: marketpulse
      SPRING_DATASOURCE_PASSWORD: marketpulse
    depends_on:
      timescaledb:
        condition: service_healthy

  stock-discovery:
    build: ./stock-discovery
    image: stock-discovery:latest
    container_name: stock-discovery
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/marketpulse
      SPRING_DATASOURCE_USERNAME: marketpulse
      SPRING_DATASOURCE_PASSWORD: marketpulse
      # Both markets-ui's direct port and markets-gateway's origin need to be allowed: the
      # browser's Origin header reflects whichever one actually served the page.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    depends_on:
      timescaledb:
        condition: service_healthy

  markets-ui:
    build: ./markets-ui
    image: markets-ui:latest
    container_name: markets-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - stock-discovery

  markets-admin:
    build: ./markets-admin
    image: markets-admin:latest
    container_name: markets-admin
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      TZ: Asia/Kolkata
      # Two URLs per service, because the two consumers are on opposite sides of the
      # network: markets-admin probes health over the compose network, while the links
      # it renders are followed by a browser on the host.
      ADMIN_REF_DATA_INTERNAL_URL: http://markets-ref-data:8081
      ADMIN_REF_DATA_EXTERNAL_URL: http://localhost:8081
      ADMIN_STOCK_DISCOVERY_INTERNAL_URL: http://stock-discovery:8082
      ADMIN_STOCK_DISCOVERY_EXTERNAL_URL: http://localhost:8082
      ADMIN_MARKETS_UI_INTERNAL_URL: http://markets-ui:80
      ADMIN_MARKETS_UI_EXTERNAL_URL: http://localhost:8080
    # Deliberately no depends_on and no database: the console must be able to start and
    # report on the others precisely when they are broken.

  markets-gateway:
    build: ./markets-gateway
    image: markets-gateway:latest
    container_name: markets-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Kolkata
      GATEWAY_ADMIN_URL: http://markets-admin:8083
      GATEWAY_UI_URL: http://markets-ui:80
    depends_on:
      - markets-ui
      - markets-admin

volumes:
  timescaledb-data:
    external: true
    name: markets-ref-data_timescaledb-data

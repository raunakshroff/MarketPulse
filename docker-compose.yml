services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  markets-ref-data:
    build: ./markets-ref-data
    image: markets-ref-data:latest
    container_name: markets-ref-data
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/marketpulse
      SPRING_DATASOURCE_USERNAME: marketpulse
      SPRING_DATASOURCE_PASSWORD: marketpulse
    depends_on:
      timescaledb:
        condition: service_healthy

  stock-discovery:
    build: ./stock-discovery
    image: stock-discovery:latest
    container_name: stock-discovery
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/marketpulse
      SPRING_DATASOURCE_USERNAME: marketpulse
      SPRING_DATASOURCE_PASSWORD: marketpulse
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      timescaledb:
        condition: service_healthy

  markets-ui:
    build: ./markets-ui
    image: markets-ui:latest
    container_name: markets-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - stock-discovery

volumes:
  timescaledb-data:
    external: true
    name: markets-ref-data_timescaledb-data

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  markets-ref-data:
    build: .
    image: markets-ref-data:latest
    container_name: markets-ref-data
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/marketpulse
      SPRING_DATASOURCE_USERNAME: marketpulse
      SPRING_DATASOURCE_PASSWORD: marketpulse
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb-data:
